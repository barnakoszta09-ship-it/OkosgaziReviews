<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e4a34"/>
      <stop offset="100%" stop-color="#0f2419"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8a217"/>
      <stop offset="100%" stop-color="#f4c04a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#faf8f3" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top gold accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#goldGrad)"/>

  <!-- Bottom gold accent bar -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#goldGrad)"/>

  <!-- Left vertical gold accent -->
  <rect x="72" y="80" width="3" height="470" fill="#e8a217" opacity="0.6"/>

  <!-- Large decorative paw print (background watermark, right side) -->
  <g transform="translate(820, 100)" opacity="0.09" fill="#e8a217">
    <!-- Main pad -->
    <ellipse cx="140" cy="250" rx="100" ry="78"/>
    <!-- Toe 1 (far left) -->
    <ellipse cx="30" cy="140" rx="42" ry="55" transform="rotate(-18, 30, 140)"/>
    <!-- Toe 2 (left-center) -->
    <ellipse cx="95" cy="85" rx="42" ry="55" transform="rotate(-7, 95, 85)"/>
    <!-- Toe 3 (right-center) -->
    <ellipse cx="185" cy="85" rx="42" ry="55" transform="rotate(7, 185, 85)"/>
    <!-- Toe 4 (far right) -->
    <ellipse cx="250" cy="140" rx="42" ry="55" transform="rotate(18, 250, 140)"/>
  </g>

  <!-- Badge chip -->
  <rect x="92" y="112" width="320" height="38" rx="19" fill="#e8a217" opacity="0.15"/>
  <rect x="92" y="112" width="320" height="38" rx="19" fill="none" stroke="#e8a217" stroke-width="1" opacity="0.4"/>
  <text x="252" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#e8a217" text-anchor="middle" letter-spacing="1.5">FÜGGETLEN KUTYATÁP PLATFORM</text>

  <!-- Paw icon in badge -->
  <text x="108" y="138" font-family="Arial" font-size="16" fill="#e8a217">🐾</text>

  <!-- Main site name - two lines for visual impact -->
  <text x="92" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" fill="#faf8f3" letter-spacing="-2">Okosgazdi</text>
  <text x="92" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" fill="#e8a217" letter-spacing="-2">Reviews<tspan fill="#faf8f3" font-size="60">.hu</tspan></text>

  <!-- Divider line -->
  <rect x="92" y="372" width="560" height="2" fill="url(#goldGrad)" opacity="0.4"/>

  <!-- Subtitle -->
  <text x="92" y="410" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#faf8f3" opacity="0.78" letter-spacing="0.3">Megbízható kutyatáp értékelések és összehasonlítók</text>

  <!-- Stats cards -->
  <!-- Card 1 -->
  <rect x="92" y="448" width="195" height="108" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="189" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" fill="#e8a217" text-anchor="middle">298</text>
  <text x="189" y="538" font-family="Arial, sans-serif" font-size="14" fill="#faf8f3" text-anchor="middle" opacity="0.6">feldolgozott értékelés</text>

  <!-- Card 2 -->
  <rect x="302" y="448" width="195" height="108" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="399" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" fill="#e8a217" text-anchor="middle">4.7</text>
  <text x="399" y="538" font-family="Arial, sans-serif" font-size="14" fill="#faf8f3" text-anchor="middle" opacity="0.6">átlag pontszám / 5</text>

  <!-- Card 3 -->
  <rect x="512" y="448" width="195" height="108" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="609" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" fill="#e8a217" text-anchor="middle">100%</text>
  <text x="609" y="538" font-family="Arial, sans-serif" font-size="14" fill="#faf8f3" text-anchor="middle" opacity="0.6">független vélemény</text>

  <!-- Right side decorative element - small paw prints trail -->
  <g fill="#e8a217" opacity="0.18">
    <!-- Small paw 1 -->
    <g transform="translate(1050, 420) scale(0.45)">
      <ellipse cx="60" cy="85" rx="38" ry="30"/>
      <ellipse cx="20" cy="45" rx="16" ry="20" transform="rotate(-15, 20, 45)"/>
      <ellipse cx="45" cy="28" rx="16" ry="20" transform="rotate(-5, 45, 28)"/>
      <ellipse cx="75" cy="28" rx="16" ry="20" transform="rotate(5, 75, 28)"/>
      <ellipse cx="100" cy="45" rx="16" ry="20" transform="rotate(15, 100, 45)"/>
    </g>
    <!-- Small paw 2 -->
    <g transform="translate(1110, 470) scale(0.32)">
      <ellipse cx="60" cy="85" rx="38" ry="30"/>
      <ellipse cx="20" cy="45" rx="16" ry="20" transform="rotate(-15, 20, 45)"/>
      <ellipse cx="45" cy="28" rx="16" ry="20" transform="rotate(-5, 45, 28)"/>
      <ellipse cx="75" cy="28" rx="16" ry="20" transform="rotate(5, 75, 28)"/>
      <ellipse cx="100" cy="45" rx="16" ry="20" transform="rotate(15, 100, 45)"/>
    </g>
  </g>

  <!-- URL watermark bottom right -->
  <text x="1140" y="610" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#faf8f3" text-anchor="end" opacity="0.35" letter-spacing="0.5">okosgazdireviews.hu</text>
</svg>
