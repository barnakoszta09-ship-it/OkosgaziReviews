<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e4a34"/>
      <stop offset="100%" stop-color="#0f2419"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top gold bar -->
  <rect x="0" y="0" width="1200" height="7" fill="#e8a217"/>
  <!-- Bottom gold bar -->
  <rect x="0" y="623" width="1200" height="7" fill="#e8a217"/>

  <!-- Paw print icon (centered, gold) -->
  <g transform="translate(600, 195)" fill="#e8a217">
    <!-- Main pad -->
    <ellipse cx="0" cy="62" rx="78" ry="62"/>
    <!-- Toe 1 far left -->
    <ellipse cx="-148" cy="-30" rx="42" ry="54" transform="rotate(-22, -148, -30)"/>
    <!-- Toe 2 left -->
    <ellipse cx="-52" cy="-82" rx="42" ry="54" transform="rotate(-8, -52, -82)"/>
    <!-- Toe 3 right -->
    <ellipse cx="52" cy="-82" rx="42" ry="54" transform="rotate(8, 52, -82)"/>
    <!-- Toe 4 far right -->
    <ellipse cx="148" cy="-30" rx="42" ry="54" transform="rotate(22, 148, -30)"/>
  </g>

  <!-- Site name -->
  <text x="600" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="bold" fill="#faf8f3" text-anchor="middle" letter-spacing="-2">OkosgazdiReviews<tspan fill="#e8a217">.hu</tspan></text>

  <!-- Tagline -->
  <text x="600" y="506" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#faf8f3" text-anchor="middle" opacity="0.7" letter-spacing="0.5">Kutyatáp review és összehasonlító platform</text>
</svg>
